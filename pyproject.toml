[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "handcheck"
version = "0.1.0"
description = "Predicts whether a tifxyz mesh render reads mirrored, from geometry and catalogue metadata; flags undecidable meshes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "tifffile>=2023.1", "imagecodecs>=2023.1"]

[project.optional-dependencies]
test = ["pytest>=7", "opencv-python-headless>=4.8"]

[project.scripts]
handcheck = "handcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
